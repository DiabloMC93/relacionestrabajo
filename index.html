<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen de Gestión y Liderazgo</title>
    <style>
        :root {
            --primary: #0ea5e9; /* Azul Océano */
            --primary-dark: #0284c7;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-sec: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            background-color: var(--card);
            width: 100%;
            max-width: 720px;
            min-height: 650px; /* Un poco más alto para textos largos */
            margin: 20px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #e2e8f0;
        }
        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .header {
            padding: 20px 40px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }

        .counters {
            display: flex;
            gap: 20px;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .counter-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .c-correct { background-color: #d1fae5; color: #065f46; }
        .c-wrong { background-color: #fee2e2; color: #991b1b; }

        .content-area {
            padding: 40px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: fadeIn 0.4s ease-out;
            overflow-y: auto; /* Scroll si el contenido es muy largo */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-meta {
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.25rem; /* Ajustado ligeramente */
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 30px;
            color: var(--text-main);
        }

        .options-list {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px 20px;
            text-align: left;
            font-size: 1rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .option-letter {
            background: #f1f5f9;
            color: var(--text-sec);
            font-weight: 700;
            min-width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        .option-btn.correct {
            border-color: var(--success);
            background-color: #ecfdf5;
            color: #065f46;
        }
        .option-btn.correct .option-letter {
            background-color: #34d399;
            color: white;
        }

        .option-btn.wrong {
            border-color: var(--error);
            background-color: #fef2f2;
            color: #991b1b;
        }
        .option-btn.wrong .option-letter {
            background-color: #f87171;
            color: white;
        }

        .footer-controls {
            padding: 20px 40px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: flex-end;
            background-color: white;
            margin-top: auto; /* Empujar al fondo */
        }

        .next-btn {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .next-btn:hover {
            background-color: var(--primary);
            transform: translateY(-2px);
        }

        .results-screen {
            text-align: center;
            display: none;
            align-items: center;
        }

        .score-card {
            background: white;
            padding: 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
        }

        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: conic-gradient(var(--primary) 0%, #f1f5f9 0%);
        }

        .score-circle::before {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 50%;
        }

        .score-text {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
        }

        .final-grade {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
        }

        .grade-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-sec);
            margin-top: 5px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }

        .summary-item {
            padding: 15px;
            border-radius: 12px;
            background: #f8fafc;
        }

        .summary-val {
            font-size: 1.5rem;
            font-weight: 800;
            display: block;
        }

        .restart-btn {
            background-color: var(--primary);
            color: white;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .restart-btn:hover {
            background-color: var(--primary-dark);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <header class="header" id="header">
        <div class="counters">
            <div class="counter-item c-correct">
                <span>Aciertos:</span> <span id="score-correct">0</span>
            </div>
            <div class="counter-item c-wrong">
                <span>Fallos:</span> <span id="score-wrong">0</span>
            </div>
        </div>
    </header>

    <div class="content-area" id="quiz-screen">
        <span class="question-meta" id="q-number">Pregunta 1</span>
        <h2 class="question-text" id="q-text">...</h2>
        <div class="options-list" id="options-list"></div>
    </div>

    <div class="content-area results-screen" id="results-screen">
        <div class="score-card">
            <div class="score-circle" id="score-circle">
                <div class="score-text">
                    <span class="final-grade" id="final-grade">0.00</span>
                    <span class="grade-label">NOTA FINAL</span>
                </div>
            </div>
            
            <p id="final-message" style="font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; color: var(--text-sec);">...</p>

            <div class="summary-grid">
                <div class="summary-item">
                    <span class="summary-val" style="color: var(--success)" id="final-correct">0</span>
                    <span style="font-size: 0.85rem; color: var(--text-sec)">Aciertos (+0.25)</span>
                </div>
                <div class="summary-item">
                    <span class="summary-val" style="color: var(--error)" id="final-wrong">0</span>
                    <span style="font-size: 0.85rem; color: var(--text-sec)">Fallos (-0.08)</span>
                </div>
            </div>

            <button class="restart-btn" onclick="initQuiz()">Volver a intentar</button>
        </div>
    </div>

    <footer class="footer-controls" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Siguiente &rarr;</button>
    </footer>
</div>

<script>
    // PREGUNTAS EXTRAÍDAS DEL TEXTO PROPORCIONADO POR EL USUARIO
    const questions = [
        { 
            q: "A la habilidad de guiar a la gente sin necesidad de una autoridad otorgada se la conoce como:", 
            options: ["Delegación.", "Liderazgo.", "Resiliencia.", "Integridad."], 
            correct: 1 
        },
        { 
            q: "Cuál de las siguientes no se considera una ventaja de delegar el trabajo:", 
            options: ["Aumenta la carga de trabajo", "Aumenta la motivación de los trabajadores", "Promueve la buena comunicación", "Promueve la autoconfianza de los trabajadores"], 
            correct: 0 
        },
        { 
            q: "Cuando en un conflicto solo se involucran las partes afectadas, se habla de:", 
            options: ["Confrontación o negociación", "Confrontación o arbitraje", "Conciliación, mediación o arbitraje", "Arbitraje, negociación o mediación"], 
            correct: 0 
        },
        { 
            q: "Cuando hay un enfrentamiento entre los integrantes de un mismo equipo, y puede verse afectada su dinámica o eficiencia, se habla de un conflicto:", 
            options: ["Intragrupal", "Intrapersonal", "Conflicto de roles", "Ninguna es correcta"], 
            correct: 0 
        },
        { 
            q: "Cuando los conflictos se mantienen ocultos por deferentes factores como la exclusión o la legitimidad, se denomina:", 
            options: ["Conflicto de interés", "Conflicto latente", "Conflicto manifiesto", "Conflicto de roles"], 
            correct: 1 
        },
        { 
            q: "El conflicto enfoque-enfoque es un conflicto intrapersonal en el que:", 
            options: ["Las opciones son varias alternativas y todas tienen un enfoque positivo.", "Las opciones son varias alternativas y todas tienen un enfoque negativas.", "Cuando se debe decidir entre opciones que pueden tener efectos positivos o negativos.", "Ninguna es correcta."], 
            correct: 0 
        },
        { 
            q: "El diagrama de Gantt:", 
            options: ["Se utiliza para priorizar u planificar tareas dividiéndolas en tareas grandes, medianas y pequeñas.", "Se basa en la idea de realizar pequeños descansos de 3-4 min cada 25 minutos de trabajo.", "Sirve para mostrar el tiempo que se le dedica a cada tarea o actividad a lo largo de un periodo.", "Ninguna de las anteriores."], 
            correct: 2 
        },
        { 
            q: "El estilo de influencia inspirador…", 
            options: ["Es aquel que se usa cuando se necesita llegar a acuerdos y pactos. Se hacen concesiones para llegar a un punto común.", "Es aquel que defiende sus ideas animando a los demás a buscar un objetivo común que ilusione a todos.", "Es aquel que se usa cuando se trata de unir ideas opuestas construyendo puentes a través de la escucha activa...", "Se basa en el razonamiento utilizando datos que contrasten las propuestas."], 
            correct: 1 
        },
        { 
            q: "El método pomodoro:", 
            options: ["Es un método para mejorar el trabajo en equipo.", "Consiste en reorganizar las tareas de más pesadas a menos", "Consiste en realizar pequeñas pausas para tener una mayor claridad mental", "Ninguna es correcta"], 
            correct: 2 
        },
        { 
            q: "El proceso de resolución de conflictos consta de los siguientes pasos:", 
            options: ["Identificación, descripción, toma de decisiones y plan de acción", "Identificación, descripción, Análisis, posibles soluciones, toma de decisiones y plan de acción.", "Plan de acción, toma de decisiones, identificación, descripción, análisis y posibles soluciones.", "Ninguna es correcta."], 
            correct: 1 
        },
        { 
            q: "El recurso más importante en cualquier organización es:", 
            options: ["Capital.", "Infraestructuras.", "Talento humano.", "Cultura sostenible."], 
            correct: 2 
        },
        { 
            q: "En la fase de toma de contacto de la negociación:", 
            options: ["Las partes intentan ponerse de acuerdo utilizando todas las herramientas o métodos disponibles...", "Las personas que van a negociar pueden verse personalmente y comienzan a analizarse y a reconocer a la otra parte...", "Es la fase final de la negociación en la que ambas partes hacen sus concesiones.", "Fase en la que ambas partes preparan la negociación determinando los objetivos..."], 
            correct: 1 
        },
        { 
            q: "En la negociación de colaboración:", 
            options: ["Una de las partes tiene una posición de poder sobre la otra y sólo acepta acuerdos que le sean beneficiosos para él.", "Se busca alcanzar un acuerdo en que las partes lleguen a un acuerdo beneficioso para ambas con una actitud colaborativa.", "Una de las partes cede ante la otra y sacrifica sus intereses para evitar conflictos.", "Ninguna es correcta."], 
            correct: 1 
        },
        { 
            q: "En la resolución de conflictos en la que intervienen terceras personas, el arbitraje es aquel en el que:", 
            options: ["El tercero involucrado propone soluciones y facilita que las partes lleguen a un acuerdo beneficioso para ambas partes.", "Las partes afectadas acuerdan que un tercero objetivo decida la solución por ellos.", "Las partes acuden a un tercero que les ayuda y anima a llegar a un acuerdo siendo testigo de ello.", "Ninguna es correcta"], 
            correct: 1 
        },
        { 
            q: "En las estrategias habituales de la negociación, la postura de imponer consiste en:", 
            options: ["El objetivo de ambas partes es llegar a un acuerdo que beneficie a ambos.", "Consiste en dar prioridad a la otra parte para sacar ventaja en otra cuestión o proyecto futuro.", "Una de las partes quiere ganar a toda costa, es una posición egoísta.", "Consiste en pasar por alto un asunto en particular que no se quiera tratar en la negociación."], 
            correct: 2 
        },
        { 
            q: "En una negociación solo puede haber acuerdo cuando ambas partes:", 
            options: ["Tienen una zona coincidente entre sus objetivos de salida y de ruptura", "No tienen una zona coincidente entre sus objetivos de salida y de ruptura", "Cuando ninguno quiera ceder en sus propuestas", "Ninguna opción es correcta"], 
            correct: 0 
        },
        { 
            q: "Entre los métodos para la toma de decisiones, el ranking consiste en:", 
            options: ["El equipo genera ideas y tiene una discusión abierta pero la decisión la toma una persona con autoridad.", "El equipo debe votar por una cuestión en particular, se debate y discute y finalmente es la mayoría la que termina decidiendo.", "El equipo debe votar la propuesta menos popular y se elimina...", "Apuntar las 4 o 5 mejores ideas que se hayan aportado y se votan de 1 a 5 puntos y se selecciona la más votada."], 
            correct: 3 
        },
        { 
            q: "La fase de la negociación de acercamiento de posturas y cierre:", 
            options: ["Es cuando se realiza la preparación de la negociación", "Es cuando ambas partes intentan ponerse de acuerdo", "Es cuando las personas que van a negociar comienzan a contactar y a analizarse", "Es cuando ambas partes ceden para llegar a un punto común y se hacen propuestas concretas"], 
            correct: 3 
        },
        { 
            q: "La motivación extrínseca:", 
            options: ["Se da cuando el individuo, por factores externos, es movido a actuar.", "Es aquella derivada de factores internos, es decir, cuando el propio individuo se esfuerza por alcanzar un objetivo.", "Es aquella que cubre las necesidades básicas (comer, beber, vestirse, etc.)", "Ninguna de las anteriores."], 
            correct: 0 
        },
        { 
            q: "Los grupos formales en la organización, pueden surgir a causa de:", 
            options: ["Afinidad entre los compañeros", "Las funciones desarrolladas", "Rangos de edad parecidos", "Aficiones compartidas"], 
            correct: 1 
        },
        { 
            q: "Para conseguir que el equipo de trabajo sea efectivo, son necesarias habilidades como:", 
            options: ["Fomentar la empatía y la retroalimentación.", "Escucha activa.", "Asertividad.", "Todas las anteriores."], 
            correct: 3 
        },
        { 
            q: "Saber otorgar responsabilidad sobre los otros mandos para optimizar tareas según las capacidades de estos se denomina:", 
            options: ["Inteligencia emocional.", "Capacidad de comunicar.", "Capacidad de captación.", "Capacidad para delegar."], 
            correct: 3 
        },
        { 
            q: "Se considera un equipo sinérgico:", 
            options: ["Aquel que funciona correctamente de forma aparente, pero en realidad tiene muchos problemas no reconocidos ni asumidos", "Es el equipo ideal al que todos los equipos deberían orientarse, todos los integrantes trabajan y colaboran...", "Cuando no existe ninguna sinergia entre los miembros del equipo y no colaboran entre sí.", "Cuando el funcionamiento del equipo está en permanente alteración..."], 
            correct: 1 
        },
        { 
            q: "Según la teoría de Herzberg, un factor higiénico es:", 
            options: ["La responsabilidad", "El reconocimiento laboral", "El salario", "El logro"], 
            correct: 2 
        },
        { 
            q: "Según la teoría de Maslow, ¿qué necesidad surge antes que el respeto?", 
            options: ["Alimentación", "Espontaneidad", "Moralidad", "Creatividad"], 
            correct: 0 
        },
        { 
            q: "Si en un conflicto interviene una tercera persona externa, el cual estudia la raíz del conflicto y emite un informe que se tiene en cuenta como una resolución oficial y de obligado cumplimiento, el método aplicado habrá sido:", 
            options: ["Arbitraje", "Negociación", "Confrontación", "Conciliación"], 
            correct: 0 
        },
        { 
            q: "Una de las características fundamentales de la comunicación oral es:", 
            options: ["Que el mensaje es perecedero", "Que el soporte es la voz", "Que ayuda a la retroalimentación de las partes", "Todas las respuestas son correctas"], 
            correct: 3 
        },
        { 
            q: "¿Cómo se denomina la siguiente técnica de dinamización de grupos? “ El jefe del equipo convoca a los miembros del equipo con antelación...\"", 
            options: ["Phillips 6/6", "Técnica del grupo nominal (TGN)", "Tormenta de ideas o brainstorming", "Seis sombreros para pensar"], 
            correct: 2 
        },
        { 
            q: "¿Cuál de estas afirmaciones se refieren a la comunicación descendente?", 
            options: ["Se da en organizaciones de un tamaño más pequeño y con un carácter muy informal.", "Es el que se da cuando las personas están en el mismo nivel jerárquico.", "Donde los directivos comparten información con los empleados por lo que se utiliza para compartir documentos oficiales.", "Ninguna es correcta."], 
            correct: 2 
        },
        { 
            q: "¿Cuál de las siguientes es una barrera fisiológica en la comunicación?", 
            options: ["Tener una actitud positiva o negativa para con nuestro interlocutor.", "Personas con problemas auditivos o visuales.", "No conocer el idioma.", "Ninguna de las anteriores es correcta."], 
            correct: 1 
        },
        { 
            q: "¿Cuál de las siguientes no es una técnica de motivación empresarial?:", 
            options: ["Delegación de responsabilidades y autoridad", "Proporcionar formación y desarrollo personal a los empleados", "Reconocer los méritos y logros de los empleados", "Proporcionar un mayor número de horas de trabajo"], 
            correct: 3 
        },
        { 
            q: "¿Cuál es una cualidad de una persona con asertividad?", 
            options: ["Habla con calma y confianza, de manera fluida.", "Sabe decir que no y ser firme en su postura.", "Mira a los ojos a las personas con quien se relaciona.", "Todas las anteriores."], 
            correct: 3 
        },
        { 
            q: "¿Cuál es una función de los directivos?", 
            options: ["Planificar.", "Gestionar.", "Organizar.", "Todas las anteriores."], 
            correct: 3 
        },
        { 
            q: "¿Cuál no es una fuente de motivación externa?", 
            options: ["Dinero.", "Autoestima.", "Reconocimiento empresarial.", "Reconocimiento social."], 
            correct: 1 
        },
        { 
            q: "¿Cuál no es una técnica para la mejora de la eficiencia de un equipo de trabajo?", 
            options: ["Tormenta de ideas.", "Estudio de casos.", "Método GTD.", "Seis sombreros para pensar."], 
            correct: 2 
        },
        { 
            q: "¿cuáles son los flujos de comunicación que se clasifican por la dirección que siguen?", 
            options: ["Comunicación vertical, comunicación horizontal y comunicación diagonal", "Comunicación ascendente, comunicación descendente y comunicación diagonal.", "Comunicación transversal, comunicación horizontal y comunicación diagonal.", "Todas las anteriores son incorrectas."], 
            correct: 0 
        },
        { 
            q: "¿Qué característica de las siguientes es propia de un buen negociador?:", 
            options: ["Tener conocimiento del tema a tratar", "Tener capacidad de observación y escucha activa", "Ser resolutivo", "Todas son correctas"], 
            correct: 3 
        },
        { 
            q: "¿Qué característica no es propia de un líder?:", 
            options: ["Autoconocimiento", "Pesimismo", "Entusiasta", "Trabajador en equipo"], 
            correct: 1 
        },
        { 
            q: "¿Qué función no se considera propia de un mando intermedio?:", 
            options: ["Planificar la producción", "Coordinar y supervisar", "Motivar", "Dirección general"], 
            correct: 3 
        },
        { 
            q: "¿Qué tres tipos de negociación existen?:", 
            options: ["La negociación competitiva, el conflicto y la negociación de colaboración", "La negociación aclaratoria, la negociación de subordinación y la negociación competitiva", "La negociación competitiva, la negociación de colaboración y la negociación de subordinación", "Ninguna es correcta"], 
            correct: 2 
        }
    ];

    let currentIdx = 0;
    let scoreCorrect = 0;
    let scoreWrong = 0;

    const ui = {
        progressBar: document.getElementById('progress-bar'),
        scoreCorrect: document.getElementById('score-correct'),
        scoreWrong: document.getElementById('score-wrong'),
        qNumber: document.getElementById('q-number'),
        qText: document.getElementById('q-text'),
        optionsList: document.getElementById('options-list'),
        nextBtn: document.getElementById('next-btn'),
        quizScreen: document.getElementById('quiz-screen'),
        resultsScreen: document.getElementById('results-screen'),
        header: document.getElementById('header'),
        footer: document.getElementById('footer'),
        finalGrade: document.getElementById('final-grade'),
        scoreCircle: document.getElementById('score-circle'),
        finalCorrect: document.getElementById('final-correct'),
        finalWrong: document.getElementById('final-wrong'),
        finalMessage: document.getElementById('final-message')
    };

    function initQuiz() {
        currentIdx = 0;
        scoreCorrect = 0;
        scoreWrong = 0;
        
        ui.resultsScreen.style.display = 'none';
        ui.quizScreen.style.display = 'flex';
        ui.header.style.display = 'flex';
        ui.footer.style.display = 'flex';
        
        updateStats();
        loadQuestion();
    }

    function updateStats() {
        ui.scoreCorrect.innerText = scoreCorrect;
        ui.scoreWrong.innerText = scoreWrong;
        const progress = ((currentIdx) / questions.length) * 100;
        ui.progressBar.style.width = `${progress}%`;
    }

    function loadQuestion() {
        ui.quizScreen.style.animation = 'none';
        ui.quizScreen.offsetHeight; 
        ui.quizScreen.style.animation = 'fadeIn 0.4s ease-out';

        const q = questions[currentIdx];
        ui.qNumber.innerText = `PREGUNTA ${currentIdx + 1} DE ${questions.length}`;
        ui.qText.innerText = q.q;
        ui.optionsList.innerHTML = '';
        ui.nextBtn.style.display = 'none';

        const letters = ['A', 'B', 'C', 'D'];

        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            
            const letter = document.createElement('div');
            letter.className = 'option-letter';
            letter.innerText = letters[index] || '';
            
            const text = document.createElement('div');
            text.innerText = opt;

            btn.appendChild(letter);
            btn.appendChild(text);
            
            btn.onclick = () => handleAnswer(index, btn);
            ui.optionsList.appendChild(btn);
        });

        // Scroll al inicio de la pregunta (útil en móviles)
        ui.quizScreen.scrollTop = 0;
        
        updateStats();
    }

    function handleAnswer(selectedIndex, btn) {
        if (ui.nextBtn.style.display === 'block') return;

        const q = questions[currentIdx];
        const buttons = ui.optionsList.querySelectorAll('.option-btn');
        
        buttons.forEach(b => b.disabled = true);

        if (selectedIndex === q.correct) {
            btn.classList.add('correct');
            scoreCorrect++;
        } else {
            btn.classList.add('wrong');
            // Mostrar la correcta
            if(buttons[q.correct]) {
                buttons[q.correct].classList.add('correct');
            }
            scoreWrong++;
        }

        updateStats();
        ui.nextBtn.style.display = 'block';
        
        if (window.innerWidth < 768) {
            ui.nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        ui.quizScreen.style.display = 'none';
        ui.header.style.display = 'none';
        ui.footer.style.display = 'none';
        ui.progressBar.style.width = '100%';
        ui.resultsScreen.style.display = 'flex';

        // Cálculo de nota: (+0.25 acierto) - (0.08 fallo)
        let rawScore = (scoreCorrect * 0.25) - (scoreWrong * 0.08);
        if (rawScore < 0) rawScore = 0;

        let gradeOutOf10 = rawScore; // 40 * 0.25 = 10
        
        ui.finalGrade.innerText = gradeOutOf10.toFixed(2);
        ui.finalCorrect.innerText = scoreCorrect;
        ui.finalWrong.innerText = scoreWrong;

        const percentage = (gradeOutOf10 / 10) * 100;
        const color = gradeOutOf10 >= 5 ? 'var(--success)' : 'var(--error)';
        
        ui.scoreCircle.style.background = `conic-gradient(${color} ${percentage}%, #f1f5f9 0%)`;
        ui.finalGrade.style.color = color;

        if (gradeOutOf10 >= 9) ui.finalMessage.innerText = "¡Excelente Trabajo! 🏆";
        else if (gradeOutOf10 >= 7) ui.finalMessage.innerText = "¡Muy Buen Resultado! 💪";
        else if (gradeOutOf10 >= 5) ui.finalMessage.innerText = "Aprobado 👍";
        else ui.finalMessage.innerText = "Necesitas Repasar 📚";
    }

    initQuiz();
</script>

</body>
</html>
